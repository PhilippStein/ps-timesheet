<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Top Knob -->
  <rect x="25" y="7" width="14" height="5" rx="2.5" ry="2.5" fill="#ffffff" />

  <!-- Clock disc -->
  <circle cx="32" cy="34" r="21" fill="#ffffff" />

  <!-- Clock hands -->
  <!-- Hour hand (~10 o'clock) -->
  <line x1="32" y1="34" x2="22" y2="24" stroke="#1971c2" stroke-width="3.5" stroke-linecap="round" />
  <!-- Minute hand (~2 o'clock) -->
  <line x1="32" y1="34" x2="44" y2="24" stroke="#1971c2" stroke-width="3" stroke-linecap="round" />

  <!-- Center accent dot -->
  <circle cx="32" cy="34" r="3" fill="#1971c2" />
</svg>
